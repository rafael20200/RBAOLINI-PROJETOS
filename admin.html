<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>Administração | RBAOLINI PROJETOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet">
<style>body{background:#f3f5f8}.admin-wrap{max-width:1100px;margin:48px auto;padding:0 16px}.admin-panel{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:28px;box-shadow:0 12px 35px #1018270d}.admin-top{background:#101827;color:#fff;padding:20px 0}.form-control{padding:11px;border-radius:10px}.btn-gold{background:#d9ad55;border-color:#d9ad55;color:#101827;font-weight:700}.project-row{border:1px solid #e8ebf0;border-radius:12px;padding:14px}.muted{color:#687386}</style>
</head><body>
<header class="admin-top"><div class="container d-flex justify-content-between align-items-center"><a class="navbar-brand text-white" href="index.html">RBAOLINI<span style="color:#d9ad55">.</span></a><a class="text-white text-decoration-none" href="index.html"><i class="bi bi-arrow-left"></i> Voltar ao site</a></div></header>
<main class="admin-wrap">
<section id="loginPanel" class="admin-panel mx-auto" style="max-width:480px"><div class="text-center mb-4"><div class="section-kicker">Área restrita</div><h1 class="h3">Painel administrativo</h1><p class="muted">Entre com seu usuário administrador.</p></div>
<form id="loginForm"><label class="form-label">E-mail</label><input id="email" class="form-control mb-3" type="email" required autocomplete="username"><label class="form-label">Senha</label><input id="password" class="form-control mb-3" type="password" required autocomplete="current-password"><button class="btn btn-gold w-100 py-2">Entrar</button></form><div id="loginMessage" class="small mt-3" role="status"></div></section>
<section id="dashboard" class="d-none"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><div class="section-kicker">Gerenciamento</div><h1 class="h2 mb-0">Projetos do portfólio</h1></div><button id="logoutBtn" class="btn btn-outline-dark rounded-pill">Sair</button></div>
<div class="admin-panel mb-4"><h2 class="h5 mb-3" id="formTitle">Adicionar projeto</h2><form id="projectForm"><input type="hidden" id="projectId"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nome do projeto *</label><input id="title" class="form-control" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Categoria</label><input id="category" class="form-control" placeholder="Automação, Desenvolvimento web"></div>
<div class="col-12"><label class="form-label">Descrição *</label><textarea id="description" class="form-control" rows="3" required></textarea></div><div class="col-md-6"><label class="form-label">Tecnologias (separe por vírgula)</label><input id="technologies" class="form-control" placeholder="PHP, MySQL, JavaScript"></div>
<div class="col-md-6"><label class="form-label">Imagem (JPG, PNG ou WebP, até 5 MB)</label><input id="image" class="form-control" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="col-md-6"><label class="form-label">Link do vídeo</label><input id="videoUrl" class="form-control" type="url" placeholder="https://www.youtube.com/watch?v=..."></div><div class="col-md-6"><label class="form-label">Link do projeto</label><input id="projectUrl" class="form-control" type="url" placeholder="https://..."></div>
<div class="col-md-6"><label class="form-label">Ordem de exibição</label><input id="displayOrder" class="form-control" type="number" value="0"></div><div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input id="published" class="form-check-input" type="checkbox"><label class="form-check-label" for="published">Publicar no site</label></div></div></div><div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-gold px-4">Salvar projeto</button><button class="btn btn-outline-secondary" id="cancelEdit" type="button">Limpar</button></div><div id="formMessage" class="small mt-3" role="status"></div></form></div>
<div class="admin-panel"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Projetos cadastrados</h2><button id="refreshBtn" class="btn btn-sm btn-outline-dark">Atualizar</button></div><div id="projectsList" class="d-grid gap-2">Carregando...</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/admin.js"></script></body></html>
